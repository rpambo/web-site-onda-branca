<app-navbar></app-navbar>
<div class="hero-content" style="overflow: hidden; position: relative; height: 100vh;">
  
  <!-- Vídeo de fundo -->
  <video autoplay muted loop playsinline 
         style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2;">
    <source src="/video/hero/hero-mentoria.mp4" type="video/mp4">
    O seu navegador não suporta vídeo.
  </video>

  <!-- Overlay -->
  <div class="uk-position-cover" style="background: rgba(0, 0, 0, 0.3); z-index: -1;"></div>

  <!-- Conteúdo -->
  <div class="uk-section uk-section-large" style="position: relative; z-index: 1;">
    <div class="uk-container uk-padding-large">
      <h1 class="uk-heading-medium uk-margin-remove" 
          style="color: white; font-weight: 500; max-width: 850px;">
        <span class="uk-text-primary">Liderar com equilíbrio</span>, unindo saúde mental e produtividade lado a lado
      </h1>
      <div class="uk-child-width-1-2@l uk-child-width-1-2@s uk-grid uk-margin-medium-top desc">
        <div class="uk-width-expand@l">
          <p style="color: white; font-weight: 400; font-size: 22px; max-width: 650px;">
            Acompanhamento personalizado para desenvolver equilíbrio entre saúde mental e produtividade.
          </p>
        </div>
        <div class="uk-width-auto@l uk-text-right@l">
          <a [routerLink]="['/contacto']" class="uk-button uk-button-default" 
             style="background-color: white; border-radius: 5px; font-size: 18px; padding: 10px 15px; color: #006699; font-weight: 500;">
             Garanta a sua vaga
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<app-mentoria-section></app-mentoria-section>
<app-mentoria-destaques></app-mentoria-destaques>
<app-calendario-mentoria></app-calendario-mentoria>
<app-contacto-gestores></app-contacto-gestores>
<app-footer></app-footer>
