            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Solicitação de Palestra ou Workshop
      tags:
      - palestras-workshops
  /v1/qualidade-vida/email:
    post:
      consumes:
      - application/json
      description: Recebe dados do participante e envia emails
      parameters:
      - description: Dados do participante
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/types.QualidadeVida'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.QualidadeVida'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inscrição no Projeto de Qualidade de Vida
      tags:
      - qualidade-vida
  /v1/reserva-evento/{id}/cancelar:
    get:
      description: Valida o token, remove a reserva e envia um e-mail de cancelamento
        ao cliente.
      parameters:
      - description: ID da Reserva
        in: path
        name: id
        required: true
        type: string
      - description: Token de confirmação
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cancelar reserva de evento
      tags:
      - reserva-evento
  /v1/reserva-evento/{id}/confirmar:
    get:
      description: Confirma uma reserva através do link enviado por e-mail.
      parameters:
      - description: ID da reserva
        in: path
        name: id
        required: true
        type: string
      - description: Token de confirmação
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirmar reserva
      tags:
      - reserva-evento
  /v1/reserva-evento/criar-reserva:
    post:
      consumes:
      - application/json
      description: Recebe um pedido de reserva de evento
      parameters:
      - description: Dados da reserva de evento
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/types.ReservaEvento'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/types.ReservaEvento'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar reserva de evento
      tags:
      - reserva-evento
  /v1/reserva-evento/sessoes:
    get:
      description: Retorna todas as sessões reservadas para bloqueio no calendário
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar sessões reservadas
      tags:
      - reserva-evento
  /v1/saude-mental/email:
    post:
      consumes:
      - application/json
      description: Recebe dados da empresa, envia confirmação ao cliente e notificação
