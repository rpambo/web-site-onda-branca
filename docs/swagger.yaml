          description: OK
          schema:
            $ref: '#/definitions/types.P7Mentoria'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Solicitação de Mentoria P7
      tags:
      - mentoria
  /v1/palestras-workshops/email:
    post:
      consumes:
      - application/json
      description: Recebe dados do formulário de palestras e workshops e envia emails
        para cliente e equipa
      parameters:
      - description: Dados da palestra ou workshop
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/types.PalestraWorkshop'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.PalestraWorkshop'
        "400":
          description: Bad Request
          schema:
